name: Deploy Pages

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  # One deploy per ref (branch or PR). Superseded commits get cancelled —
  # Pages deploys are idempotent, only the latest matters.
  group: deploy-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: cloudflare pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # For pull_request events, deploy the PR branch HEAD as-pushed
          # (not the synthesized refs/pull/N/merge commit). Matches the
          # CI workflow's checkout policy.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify static artifact
        run: |
          test -d public || { echo "public/ missing"; exit 1; }
          test -f public/index.html || { echo "public/index.html missing"; exit 1; }
          echo "public/ contents:"
          find public -type f | sort

      - name: Ensure Cloudflare Pages project exists
        # Idempotent bootstrap: attempt to create; tolerate the specific
        # "already exists" error. Keeps the workflow self-sufficient so
        # the first deploy after enabling Pages previews doesn't require
        # a manual dashboard step, and subsequent deploys don't re-fail.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          output=$(npx -y wrangler@3 pages project create rsteg --production-branch=main 2>&1)
          rc=$?
          set -e
          echo "$output"
          if [ "$rc" -ne 0 ] && ! echo "$output" | grep -q "already exists"; then
            exit "$rc"
          fi

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --branch=<non-production-branch> triggers a Cloudflare Pages
          # preview deployment at <branch>.rsteg.pages.dev. For main it
          # deploys to production.
          command: pages deploy public --project-name=rsteg --branch=${{ github.head_ref || github.ref_name }}

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr comment "$PR_NUMBER" --body "🚀 **Cloudflare Pages preview**
          - Preview: $DEPLOY_URL
          - Branch alias: $ALIAS_URL
          - Commit: \`$COMMIT_SHA\`
          - Pages: [/](${DEPLOY_URL}) · [/algo](${DEPLOY_URL}/algo) · [/algo/lsb-linear](${DEPLOY_URL}/algo/lsb-linear) · [/algo/lsb-permuted](${DEPLOY_URL}/algo/lsb-permuted) · [/algo/payload-header](${DEPLOY_URL}/algo/payload-header) · [/algo/aead](${DEPLOY_URL}/algo/aead)

          Note: the \`/api/algo/*\` POST endpoints (permutation trace, header encoder) need the Rust backend and are not exercised by the static preview."
