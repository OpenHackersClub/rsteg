[workspace]
resolver = "2"
members = [
    "crates/rsteg-core",
    "crates/rsteg-bmp",
    "crates/rsteg-wav",
    "crates/rsteg-crypto-aead",
    "crates/rsteg-png",
    "crates/rsteg-cli",
    "crates/rsteg-bench",
    "crates/rsteg-wasm",
    "crates/rsteg-site-build",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/OpenHackersClub/rsteg"
homepage = "https://github.com/OpenHackersClub/rsteg"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"

# Dedicated release profile for wasm32-unknown-unknown shipping artifacts.
# Required by spec 10: panic = "abort" because unwinding across the
# hand-rolled extern "C" ABI would be UB. Used by `cargo build -p rsteg-wasm
# --profile release-wasm --target wasm32-unknown-unknown`.
[profile.release-wasm]
inherits = "release"
panic = "abort"
lto = true
opt-level = "z"
codegen-units = 1
strip = "symbols"
