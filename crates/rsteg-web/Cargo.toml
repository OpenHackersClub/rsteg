[package]
name = "rsteg-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Dev-only axum demo site for rsteg. Not part of the shipped supply-chain posture."

[lints]
workspace = true

[dependencies]
rsteg-core = { path = "../rsteg-core" }
rsteg-bmp  = { path = "../rsteg-bmp" }
axum = { version = "0.7", default-features = false, features = ["http1", "tokio", "multipart", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
